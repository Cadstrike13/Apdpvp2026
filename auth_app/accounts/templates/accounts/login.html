{% extends "base_centered.html" %}
{% block title %}Connexion — APDPVP{% endblock %}

{% block content %}
<h2 class="text-xl font-semibold text-gray-800 mb-6">Connexion</h2>

{% if form.non_field_errors %}
  <div class="mb-4 px-4 py-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200">
    {{ form.non_field_errors|join:" " }}
  </div>
{% endif %}

<form method="post" class="space-y-4">
  {% csrf_token %}
  <div>
    <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ form.username.label }}</label>
    {{ form.username }}
  </div>
  <div>
    <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ form.password.label }}</label>
    {{ form.password }}
  </div>

  <div class="text-right">
    <a href="{% url 'accounts:password_reset' %}" class="text-sm text-indigo-600 hover:underline">Mot de passe oublié ?</a>
  </div>

  <button type="submit"
          class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 transition">
    Se connecter
  </button>
</form>
{% endblock %}
