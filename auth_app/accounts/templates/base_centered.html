<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}APDPVP — Accès{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-indigo-800 to-indigo-950 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white">APDPVP</h1>
      <p class="text-indigo-300 text-sm">Portail d'accès unique</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            <div class="px-4 py-3 rounded-lg text-sm
                        {% if message.tags == 'success' %}bg-green-50 text-green-700 border border-green-200
                        {% elif message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
                        {% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
