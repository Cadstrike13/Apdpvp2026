{% extends "base_centered.html" %}
{% block title %}Email envoyé — APDPVP{% endblock %}

{% block content %}
<div class="text-center">
  <i data-lucide="mail-check" class="w-10 h-10 mx-auto text-indigo-500 mb-3"></i>
  <h2 class="text-xl font-semibold text-gray-800 mb-2">Email envoyé</h2>
  <p class="text-sm text-gray-500 mb-6">
    Si un compte existe avec cette adresse, un email contenant les instructions de réinitialisation vient de vous être envoyé.
  </p>
  <a href="{% url 'accounts:login' %}" class="text-indigo-600 hover:underline text-sm">Retour à la connexion</a>
</div>
{% endblock %}
