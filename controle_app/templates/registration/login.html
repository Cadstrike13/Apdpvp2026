{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-white shadow-sm border border-gray-100 rounded-lg p-6">
  <h1 class="text-xl font-semibold mb-4 text-gray-900">Connexion</h1>
  {% if form.errors %}
    <p class="mb-4 rounded-md bg-red-50 text-red-800 border border-red-200 px-4 py-2 text-sm">
      Identifiant ou mot de passe incorrect.
    </p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="block text-sm font-medium mb-1 text-gray-700" for="id_username">Identifiant</label>
      <input type="text" name="username" id="id_username" autofocus required
             class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 shadow-sm focus:bg-white focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1 text-gray-700" for="id_password">Mot de passe</label>
      <input type="password" name="password" id="id_password" required
             class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 shadow-sm focus:bg-white focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 transition-colors text-white rounded-md py-2 font-medium">
      Se connecter
    </button>
  </form>
</div>
{% endblock %}
