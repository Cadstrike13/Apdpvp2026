<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-bold">Employes</h2>
  <a href="{% url 'employees:create' %}"
     hx-get="{% url 'employees:create' %}"
     hx-target="#main-content"
     hx-push-url="true"
     class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700">
    + Nouvel employe
  </a>
</div>

<input type="search"
       name="q"
       placeholder="Rechercher un employe..."
       value="{{ query }}"
       hx-get="{% url 'employees:list' %}"
       hx-trigger="input changed delay:300ms"
       hx-target="#employee-table"
       hx-swap="innerHTML"
       class="w-full mb-4 px-4 py-2 border rounded-lg">

<div id="employee-table" class="bg-white rounded-xl shadow-sm overflow-hidden">
  {% include "employees/partials/table.html" %}
</div>
