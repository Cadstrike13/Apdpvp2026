<ul class="divide-y divide-gray-100">
  {% for c in candidats %}
  <li id="candidate-row-{{ c.pk }}" class="py-3">
    <div class="flex justify-between items-start">
      <div class="text-sm">
        <span class="font-medium">{{ c.nom }}</span>
        <span class="text-gray-400">— {{ c.offre.titre|default:"candidature spontanée" }}</span>
        <div class="flex gap-1 mt-1">
          <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">{{ c.get_type_demande_display }}</span>
          <span class="text-xs px-2 py-0.5 rounded-full
            {% if c.priorite == 'urgente' %}bg-red-100 text-red-700
            {% elif c.priorite == 'importante' %}bg-orange-100 text-orange-700
            {% else %}bg-gray-100 text-gray-600{% endif %}">{{ c.get_priorite_display }}</span>
        </div>
      </div>
      <span class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-600">{{ c.get_statut_display }}</span>
    </div>
    <div class="flex gap-3 mt-2 text-xs">
      {% if c.cv %}<a href="{{ c.cv.url }}" target="_blank" class="text-blue-500 hover:underline">CV</a>{% endif %}
      <a href="{% url 'recruitment:candidate_update' c.pk %}"
         hx-get="{% url 'recruitment:candidate_update' c.pk %}" hx-target="#main-content" hx-push-url="true"
         class="text-amber-500 hover:underline">Modifier</a>
      <button hx-delete="{% url 'recruitment:candidate_delete' c.pk %}"
              hx-target="#candidate-row-{{ c.pk }}" hx-swap="outerHTML"
              hx-confirm="Supprimer ce candidat ?"
              class="text-red-500 hover:underline">Supprimer</button>
    </div>
  </li>
  {% empty %}
  <li class="py-3 text-gray-400 text-sm">Aucun dossier.</li>
  {% endfor %}
</ul>
