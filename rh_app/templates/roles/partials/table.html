<div id="roles-table" class="bg-white rounded-xl shadow-sm overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
      <tr>
        <th class="px-4 py-3 text-left">Role</th>
        <th class="px-4 py-3 text-left">Permissions</th>
        <th class="px-4 py-3 text-left">Membres</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      {% for role in roles %}
      <tr class="hover:bg-gray-50 align-top">
        <td class="px-4 py-3">
          <span class="font-medium">{{ role.label }}</span>
          <span class="block text-xs text-gray-400">{{ role.code }}</span>
        </td>
        <td class="px-4 py-3">
          <span class="px-2 py-1 rounded-full text-xs bg-blue-100 text-blue-700">{{ role.perm_count }}</span>
        </td>
        <td class="px-4 py-3">
          <div class="flex flex-wrap gap-2">
            {% for m in role.members %}
            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs bg-emerald-50 text-emerald-700">
              {{ m.get_full_name|default:m.username }}
              <button hx-post="{% url 'roles:remove' role.code m.pk %}"
                      hx-target="#roles-table" hx-swap="outerHTML"
                      hx-confirm="Retirer ce role a {{ m.username }} ?"
                      class="text-emerald-500 hover:text-red-600 font-bold leading-none">&times;</button>
            </span>
            {% empty %}
            <span class="text-gray-400 text-xs">Aucun membre</span>
            {% endfor %}
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
